steps:
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    pip install --break-system-packages --no-cache-dir huggingface_hub hf_transfer google-cloud-storage &&
    REPO_ID=${_HF_MODEL_ID} \
    BUCKET_NAME=${_BUCKET_NAME} \
    GCS_PREFIX=${_GCS_PREFIX} \
    python3 -u transfer_shards.py ${_START_SHARD} ${_END_SHARD} ${_TOTAL_SHARDS}
options:
  machineType: 'E2_HIGHCPU_32'
  diskSizeGb: 200
timeout: '14400s'
substitutions:
  _HF_MODEL_ID: 'Qwen/Qwen3.8-Flash-Next'
  _BUCKET_NAME: 'YOUR_GCS_BUCKET_NAME'
  _GCS_PREFIX: 'vertex_model_ready'
  _START_SHARD: '1'
  _END_SHARD: '131'
  _TOTAL_SHARDS: '131'
